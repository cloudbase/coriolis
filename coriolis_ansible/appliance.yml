---
- name: Apply roles for the Coriolis appliance
  any_errors_fatal: true
  gather_facts: false
  hosts:
    - appliance
  tasks:
    - import_role:
        name: common/mariadb
      when: coriolis_action in ["deploy", "reconfigure", "update"]

    - import_role:
        name: coriolis/common

    - import_role:
        name: coriolis/logger

    - import_role:
        name: coriolis/api

    - import_role:
        name: coriolis/conductor

    - import_role:
        name: coriolis/replica-cron

    - import_role:
        name: coriolis/worker

    - import_role:
        name: coriolis/web

    - import_role:
        name: coriolis/web-proxy

    - import_role:
        name: coriolis/licensing-server
      when: enable_coriolis_licensing_server | bool

    - meta: flush_handlers

    - import_role:
        name: coriolis/common
        tasks_from: validation
      when: coriolis_action in ["deploy", "reconfigure", "update"]

- name: Apply roles for the Coriolis Licensing UI
  any_errors_fatal: true
  gather_facts: false
  hosts:
    - licensing_ui
  tasks:
    - import_role:
        name: coriolis/licensing-ui
