---
- name: Create step user
  ansible.builtin.user:
    home: "{{ step_ca_home }}"
    name: step
    state: present

- name: Create Step config directory
  file:
    path: "{{ step_ca_home }}"
    state: directory
    owner: 1000
    group: 1000

- name: Render templates
  template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    backup: "{{ item.backup }}"
    mode: "{{ item.mode }}"
  with_items:
    - { src: install-step-cli.sh.j2, dest: "{{ step_ca_home }}/install-step-cli.sh", backup: no, mode: 700}

- include_tasks: setup_step_ca_container.yml

- name: Install Step CLI
  shell: "bash {{ step_ca_home }}/install-step-cli.sh"
  register: result
  retries: 10
  delay: 5
  until: result is succeeded

- name: Get step-ca fingerprint stat
  stat:
    path: "{{ step_ca_home }}/fingerprint"
  register: spep_ca_fp_stat

- name: Bootstrap CA
  shell: "step ca bootstrap -f --ca-url https://127.0.0.1:{{ step_ca_port }} --fingerprint $(step certificate fingerprint {{ step_ca_home }}/certs/root_ca.crt)"
  register: result
  retries: 10
  delay: 5
  when: not spep_ca_fp_stat.stat.exists
  until: result is succeeded

- name: Save CA fingerint
  shell: "step certificate fingerprint {{ step_ca_home }}/certs/root_ca.crt > {{ step_ca_home }}/fingerprint"
  register: result
  retries: 10
  delay: 5
  when: not spep_ca_fp_stat.stat.exists
  until: result is succeeded

- name: Configure Step CA
  script: "{{ coriolis_ansible_install_dir }}/utils/configure_step_ca.py"
  notify:
    - "restart step-ca"

- name: Check if ACME is installed
  shell: grep -q ACME {{ step_ca_home }}/config/ca.json 2>&1 >/dev/null
  register: has_step_ca
  ignore_errors: true

- name: Add ACME provisioner to Step CA
  shell: step ca provisioner add --type=ACME acme --ca-config {{ step_ca_home }}/config/ca.json
  register: result
  retries: 10
  delay: 5
  until: result is succeeded
  when: not has_step_ca is succeeded
  notify:
    - "restart step-ca"

- name: Flush handlers
  meta: flush_handlers

- name: Check custom certificate mark file exists
  stat:
    path: "{{ coriolis_appliance_custom_cert }}"
  register: custom_cert_mark

- include_tasks: create_coriolis_appliance_tls_certificates.yml
  when: not custom_cert_mark.stat.exists

- name: "Ensure kolla and certificate dir exist"
  file:
    path: "{{ item }}"
    state: directory
    mode: 0755
  with_items:
    - /etc/kolla
    - /etc/kolla/certificates
    - /etc/kolla/certificates/ca

# The extra CA must have the .crt extension, otherwise it will be ignored
- name: "Copying over ca-certificate to kolla config dir"
  copy:
      src: "{{ item.src }}"
      dest: "{{ item.dest }}"
  loop:
    - src: "{{ coriolis_appliance_tls_cacert }}"
      dest: "/etc/kolla/certificates/ca/coriolis-ca.crt"
    - src: "{{ coriolis_appliance_tls_certificate }}"
      dest: "/etc/kolla/certificates/rabbitmq-cert.pem"
    - src: "{{ coriolis_appliance_tls_key }}"
      dest: "/etc/kolla/certificates/rabbitmq-key.pem"

- name: Create service certificate folder
  file:
    path: "{{ coriolis_config_dir }}/ssl"
    state: directory
    mode: 0755

- name: Create CA certificate folder
  file:
    path: "{{ coriolis_config_dir }}/ssl/ca"
    state: directory
    mode: 0755

- name: "Copying over certificates"
  copy:
      src: "{{ item.src }}"
      dest: "{{ item.dest }}"
  loop:
    - src: "{{ coriolis_appliance_tls_cert_bundle }}"
      dest: "{{ coriolis_config_dir }}/ssl/coriolis.crt"
    - src: "{{ coriolis_appliance_tls_key }}"
      dest: "{{ coriolis_config_dir }}/ssl/coriolis.key"
    - src: "{{ coriolis_appliance_tls_cacert }}"
      dest: "{{ coriolis_config_dir }}/ssl/ca/coriolis-ca.crt"

- name: Ensure ca is world readable
  file:
    path: "{{ coriolis_config_dir }}/ssl/ca/coriolis-ca.crt"
    state: file
    mode: 0644
