---
- name: Remove Docker container
  docker_container:
    state: absent
    name: coriolis-web-proxy

- name: Remove Docker image
  docker_image:
    state: absent
    force_absent: yes
    name: "{{ docker_images_namespace }}/coriolis-web-proxy:{{ docker_images_tag }}"

- include_tasks: setup_web_proxy_container.yml
