---
- name: Create build directory
  file:
    path: "{{ build_dir }}"
    state: directory

- name: Render template
  template:
    src: Dockerfile.j2
    dest: "{{ build_dir }}/coriolis-replica-cron.Dockerfile"
  notify:
    - "build coriolis-replica-cron"

- name: "Get Docker image stat"
  docker_image_info:
    name: "{{ coriolis_replica_cron_docker_image_url }}"
  register: docker_image_info

- name: "Trigger Docker image build"
  command: /bin/true
  notify:
    - "build coriolis-replica-cron"
  when: docker_image_info.images | length == 0
