---
- name: Create build directory
  file:
    path: "{{ build_dir }}"
    state: directory

- name: Clone git repository
  git:
    repo: "https://github.com/{{ repo_owner }}/coriolis-web"
    dest: "{{ build_dir }}/coriolis-web"
    update: yes
    force: yes
    version: "{{ repo_branch }}"
  vars:
    repo_owner: "{{ custom_repo_owner_names['web'] | default('cloudbase') }}"
    repo_branch: "{{ custom_repo_branch_names['web'] | default('master') }}"
  register: result
  retries: 10
  delay: 5
  until: result is succeeded
  notify:
    - "build coriolis-web"

- name: Render template
  template:
    src: Dockerfile.j2
    dest: "{{ build_dir }}/coriolis-web.Dockerfile"
  notify:
    - "build coriolis-web"

- name: "Get Docker image stat"
  docker_image_info:
    name: "{{ coriolis_web_docker_image_url }}"
  register: docker_image_info

- name: "Trigger Docker image build"
  command: /bin/true
  notify:
    - "build coriolis-web"
  when: docker_image_info.images | length == 0
