---
- name: Create build directory
  file:
    path: "{{ build_dir }}"
    state: directory

- name: Render template
  template:
    src: Dockerfile.j2
    dest: "{{ build_dir }}/coriolis-api.Dockerfile"
  notify:
    - "build coriolis-api"

- import_role:
    name: common/docker
    tasks_from: build_image
  vars:
    image_name: coriolis-api
    remove_existing: false
