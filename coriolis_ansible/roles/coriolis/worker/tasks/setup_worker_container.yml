---
- name: Setup coriolis-worker container
  docker_container:
    name: coriolis-worker
    image: "{{ coriolis_worker_docker_image_url }}"
    pull: "{{ docker_pull_images }}"
    hostname: "{{ coriolis_worker_service_hostname }}"
    state: started
    restart: yes
    restart_policy: unless-stopped
    network_mode: host
    # In order to use open-iscsi inside the container, we'll
    # grant privileged rights and mount /lib/modules as well as /dev.
    privileged: true
    volumes:
      - /lib/modules:/lib/modules
      - /dev:/dev
      # The container entry point script attempts to override /dev/log.
      - /dev/null:/dev/log
      - "{{ coriolis_config_dir }}:{{ coriolis_config_dir }}:ro"
      - "{{ coriolis_log_dir }}:{{ coriolis_log_dir }}"
      - "{{ coriolis_logger_socket_dir }}:{{ coriolis_logger_socket_dir }}"
      - "{{ coriolis_export_dir }}:{{ coriolis_export_dir }}:rw"
      - "{{ coriolis_vmware_vix_disklib_dir }}:{{ coriolis_vmware_vix_disklib_dir }}:ro"
      - "{{ coriolis_hyperv_share_local_dir }}:{{ coriolis_hyperv_share_local_dir }}:rw"
      - "{{ coriolis_profiling_dir_host }}/worker:{{ coriolis_profiling_dir_container }}"
      - "{{ coriolis_libvirt_provider_db_file }}:{{ coriolis_libvirt_provider_db_file }}:rw"
