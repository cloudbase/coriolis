---
- name: "build coriolis-minion-manager"
  listen: "build coriolis core components"
  include_tasks: "{{ playbook_dir }}/roles/common/docker/tasks/build_image.yml"
  vars:
    image_name: coriolis-minion-manager

- name: "restart coriolis-minion-manager"
  listen: "restart coriolis core components"
  shell: "docker restart coriolis-minion-manager"
