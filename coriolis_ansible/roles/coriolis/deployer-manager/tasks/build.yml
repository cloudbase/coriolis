---
- name: Create build directory
  file:
    path: "{{ build_dir }}"
    state: directory

- name: Render template
  template:
    src: Dockerfile.j2
    dest: "{{ build_dir }}/coriolis-deployer-manager.Dockerfile"
  notify:
    - "build coriolis-deployer-manager"

- name: Get Docker image stat"
  docker_image_info:
    name: "{{ coriolis_deployer_manager_docker_image_url }}"
  register: docker_image_info

- name: "Trigger Docker image build"
  command: /bin/true
  notify:
    - "build coriolis-deployer-manager"
  when: docker_image_info.images | length == 0
