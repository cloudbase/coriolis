---
- name: "build coriolis-metal-hub"
  include_tasks: "{{ playbook_dir }}/roles/common/docker/tasks/build_image.yml"
  vars:
    image_name: coriolis-metal-hub
    image_tag: "{{ coriolis_metal_hub_docker_image_tag }}"

- name: "restart coriolis-metal-hub"
  shell: "docker restart coriolis-metal-hub"
