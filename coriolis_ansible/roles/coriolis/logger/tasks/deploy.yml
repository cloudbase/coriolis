---
- name: Create directories
  file:
    path: "{{ item }}"
    state: directory
  with_items:
    - "{{ influxdb_config_dir }}"
    - "{{ coriolis_logger_config_dir }}"

- name: Create data volumes
  docker_volume:
    name: "{{ item }}"
  with_items:
    - "{{ influxdb_data_volume_name }}"
    - "{{ coriolis_logger_volume_name }}"

- include_tasks: setup.yml
