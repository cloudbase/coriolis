---
- name: Remove Docker containers
  docker_container:
    state: absent
    name: "{{ item }}"
  with_items:
    - influxdb
    - coriolis-logger
    - coriolis-api
    - coriolis-conductor
    - coriolis-replica-cron
    - coriolis-worker
    - coriolis-web

- name: Remove Docker image
  docker_image:
    state: absent
    force_absent: yes
    name: "{{ docker_registry }}/{{ docker_namespace }}/coriolis-logger:{{ docker_images_tag }}"

- name: Remove directories
  file:
    state: absent
    path: "{{ item }}"
  with_items:
    - "{{ influxdb_config_dir }}"
    - "{{ coriolis_logger_config_dir }}"

- name: Remove volumes
  docker_volume:
    state: absent
    name: "{{ item }}"
  with_items:
    - "{{ influxdb_data_volume_name }}"
    - "{{ coriolis_logger_volume_name }}"
