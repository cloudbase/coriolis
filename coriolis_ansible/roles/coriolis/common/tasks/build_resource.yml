---
- name: Build resource
  docker_container:
    name: coriolis-resource-builder
    image: golang:alpine
    detach: no
    command: "sh -c 'export GO111MODULE=on && apk add make && {{ resource_build_script }}'"
    volumes:
      - "{{ build_dir }}:{{ build_dir }}"
  register: result
  retries: 10
  delay: 5
  until: result is succeeded

- name: Cleanup temporary container used for the resource build
  docker_container:
    name: coriolis-resource-builder
    state: absent
