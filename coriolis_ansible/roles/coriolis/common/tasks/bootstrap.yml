---
- name: Gather facts
  setup:

# More reliable than ansible_fqdn as that actually reads /etc/hosts which we are trying to tempalte
- name: Register appliance FQDN
  shell: hostnamectl hostname
  register: fqdn

- name: Update /etc/hosts
  blockinfile:
    dest: /etc/hosts
    marker: "# {mark} ANSIBLE GENERATED HOSTS"
    block: "{{ bind_address }}    {{ fqdn.stdout }} {{ ansible_hostname }}"

- name: Check whether cloud-init is installed, and ensure manage_etc_hosts is disabled
  block:
    - name: Get /etc/cloud/cloud.cfg file stat
      stat:
        path: /etc/cloud/cloud.cfg
      register: cloud_init

    - name: Disable cloud-init manage_etc_hosts
      copy:
        content: >
          manage_etc_hosts: false
        dest: /etc/cloud/cloud.cfg.d/99-coriolis.cfg
        mode: "0660"
      when: cloud_init.stat.exists

- name: Remove kolla_toolbox container
  docker_container:
    name: kolla_toolbox
    state: absent

- name: Render templates
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
    backup: "{{ item.backup }}"
  with_items:
    - { src: templates/coriolis-logrotate-conf.j2, dest: /etc/logrotate.d/coriolis-logrotate-conf, mode: '0644', backup: no }
    - { src: templates/rc.local.j2, dest: /etc/rc.local, mode: '0755', backup: no }

- name: Copy logrotate.timer to a new location
  ansible.builtin.copy:
    src: /lib/systemd/system/logrotate.timer
    dest: /etc/systemd/system/logrotate.timer

- name: Ensure logrotate.timer runs hourly.
  ansible.builtin.lineinfile:
    path: /etc/systemd/system/logrotate.timer
    regex: '^OnCalendar='
    line: OnCalendar=hourly

- name: Reload systemd logrotate.timer
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Create chain
  ansible.builtin.iptables:
    chain: EXPOSE_PROTECT
    chain_management: yes
    state: present

- name: Flush chain
  ansible.builtin.iptables:
    chain: EXPOSE_PROTECT
    flush: yes

- name: Hook chain into INPUT
  ansible.builtin.iptables:
    chain: INPUT
    jump: EXPOSE_PROTECT
    state: present

- name: Allow localhost
  ansible.builtin.iptables:
    chain: EXPOSE_PROTECT
    source: 127.0.0.1
    jump: ACCEPT

- name: Allow exposed IP
  ansible.builtin.iptables:
    chain: EXPOSE_PROTECT
    source: "{{ bind_address }}"
    jump: ACCEPT
  when: bind_address != "127.0.0.1"

- name: Add reject rules
  ansible.builtin.iptables:
    chain: EXPOSE_PROTECT
    protocol: tcp
    destination_port: "{{ item }}"
    jump: REJECT
  with_items: "{{ protected_ports }}"

- name: Reject Step CA
  ansible.builtin.iptables:
    chain: EXPOSE_PROTECT
    protocol: tcp
    destination_port: "{{ step_ca_port }}"
    jump: REJECT
  when: reject_step_ca

- name: Save iptables rules
  ansible.builtin.command: sh -c "iptables-save > /etc/iptables.rules"

- name: Install iptables restore service
  ansible.builtin.copy:
    dest: /etc/systemd/system/iptables-restore.service
    mode: '0644'
    content: |
      [Unit]
      Description=Restore iptables firewall rules
      DefaultDependencies=no
      Before=network-pre.target
      Wants=network-pre.target

      [Service]
      Type=oneshot
      ExecStart=/sbin/iptables-restore /etc/iptables.rules

      [Install]
      WantedBy=multi-user.target

- name: Enable iptables restore service
  ansible.builtin.systemd:
    name: iptables-restore.service
    enabled: true
    daemon_reload: true
