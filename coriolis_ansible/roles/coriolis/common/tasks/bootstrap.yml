---
- name: Gather facts
  setup:

# More reliable than ansible_fqdn as that actually reads /etc/hosts which we are trying to tempalte
- name: Register appliance FQDN
  shell: hostnamectl hostname
  register: fqdn

- name: Update /etc/hosts
  blockinfile:
    dest: /etc/hosts
    marker: "# {mark} ANSIBLE GENERATED HOSTS"
    block: "{{ bind_address }}    {{ fqdn.stdout }} {{ ansible_hostname }}"

- name: Check whether cloud-init is installed, and ensure manage_etc_hosts is disabled
  block:
    - name: Get /etc/cloud/cloud.cfg file stat
      stat:
        path: /etc/cloud/cloud.cfg
      register: cloud_init

    - name: Disable cloud-init manage_etc_hosts
      copy:
        content: >
          manage_etc_hosts: false
        dest: /etc/cloud/cloud.cfg.d/99-coriolis.cfg
        mode: "0660"
      when: cloud_init.stat.exists

- name: Remove kolla_toolbox container
  docker_container:
    name: kolla_toolbox
    state: absent

- name: Copy Coriolis logrotate configuration.
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "{{ item.mode }}"
    backup: "{{ item.backup }}"
  with_items: 
    - { src: templates/coriolis-logrotate-conf.j2, dest: /etc/logrotate.d/coriolis-logrotate-conf, mode: '0644', backup: no}

- name: Copy logrotate.timer to a new location
  ansible.builtin.copy:
    src: /lib/systemd/system/logrotate.timer
    dest: /etc/systemd/system/logrotate.timer

- name: Ensure logrotate.timer runs hourly.
  ansible.builtin.lineinfile:
    path: /etc/systemd/system/logrotate.timer
    regex: '^OnCalendar='
    line: OnCalendar=hourly
    
- name: Reload systemd logrotate.timer
  ansible.builtin.systemd_service:
    daemon_reload: true