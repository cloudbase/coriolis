---
#
# The options in this file can be overridden in 'config.yml'
#

build_dir: "{{ playbook_dir }}/build"

bind_address: 127.0.0.1

enable_coriolis_licensing_server: false

docker_registry: registry.cloudbase.it
docker_namespace: appliance
docker_images_tag: latest
docker_pull_images: true

coriolis_debug: true

coriolis_port: 7667
coriolis_base_url: "http://{{ bind_address }}:{{ coriolis_port }}/v1"
coriolis_web_ui_base_url: "http://{{ bind_address }}:3000"

coriolis_config_dir: /etc/coriolis
coriolis_log_dir: /var/log/coriolis
coriolis_vmware_vix_disklib_dir: /opt/coriolis/vmware-vix-disklib
coriolis_hyperv_share_local_dir: /opt/coriolis/hyperv-exports
coriolis_export_dir: /opt/coriolis/export
coriolis_profiling_dir_container: /opt/coriolis/profiling

coriolis_export_providers: ["openstack", "oracle-vm", "opc", "azure", "scvmm", "vmware", "aws"]
coriolis_import_providers: ["openstack", "oracle-vm", "opc", "azure", "scvmm", "oci", "aws"]

coriolis_logger_socket_dir: /var/run/coriolis-logger
coriolis_logger_socket_name: logger.socket
coriolis_logger_socket_file: "{{ coriolis_logger_socket_dir }}/{{ coriolis_logger_socket_name }}"
coriolis_logger_volume_name: coriolis-logger
coriolis_logger_port: 9998
coriolis_logger_endpoint: "http://{{ bind_address }}:{{ coriolis_logger_port }}/api/v1"
coriolis_logger_ws_url: "ws://{{ bind_address }}:{{ coriolis_logger_port }}/api/v1/ws"

coriolis_licensing_server_port: 37667
coriolis_licensing_server_endpoint: "http://{{ bind_address }}:{{ coriolis_licensing_server_port }}/v1"
coriolis_licensing_ui_port: 3010
coriolis_licensing_ui_endpoint: "http://{{ bind_address }}:{{ coriolis_licensing_ui_port }}/licensing-ui"

# We can only specify one global "[oslo_concurrency] lock_path" in
# coriolis.conf so we will map separate directories on the host to
# the same subpath within all of the containers:
coriolis_locks_dir_containers: "/opt/coriolis/locks"
coriolis_locks_dir_host: "/opt/coriolis/locks"
coriolis_conductor_locks_dir_host: "{{ coriolis_locks_dir_host }}/conductor"
coriolis_minion_manager_locks_dir_host: "{{ coriolis_locks_dir_host }}/minion-manager"
