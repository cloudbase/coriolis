---
- hosts: localhost

  tasks:

    - name: Creating config directory
      file:
        path: "{{ coriolis_config_directory_path_host }}"
        state: directory

    - name: Creating Certs directory
      file:
          path: "{{ coriolis_certs_path_host }}"
          state: directory

    - name: Generating Cert files
      shell: |
        $(test -e "{{ coriolis_certs_path_host }}/coriolis.crt" && test -e "{{ coriolis_certs_path_host }}/coriolis.key") || $(rm -rf "{{ coriolis_certs_path_host }}/coriolis.{crt,key}" && openssl req -new -newkey rsa:4096 -days 3650 -nodes -x509 -subj "/C=RO/ST=Timis/L=Timisoara/CN=Coriolis Self Signed" -keyout "{{ coriolis_certs_path_host }}/coriolis.key" -out "{{ coriolis_certs_path_host }}/coriolis.crt")

    - name: Creating coriolis-web-vhost.conf
      template:
        src: "./templates/coriolis-web-vhost.conf.j2"
        dest: "{{ coriolis_config_directory_path_host }}/coriolis-web-vhost.conf"

    - name: coriolis-web-proxy container
      docker_container:
        name: coriolis-web-proxy
        image: "{{ docker_registry }}/{{ coriolis_containers_namespace }}/coriolis-web-proxy:{{ docker_images_tag }}"
        pull: "{{ pull_coriolis_docker_images }}"
        hostname: coriolis-web-proxy
        state: started
        restart: yes
        restart_policy: unless-stopped
        network_mode: host
        volumes:
        - "{{ coriolis_certs_path_host }}:{{ coriolis_certs_path }}:ro"
        - "{{ coriolis_config_directory_path_host }}:{{ coriolis_config_directory_path }}"
