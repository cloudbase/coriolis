---
- hosts: localhost
  vars:
      all_providers: "{{ export_providers | union(import_providers) }}"
  tasks:
    - name: Creating build directory
      file:
        path: ./build
        state: directory

    - name: Creating Proxy Docker build files 
      template: src={{ docker_template }}/Dockerfile.webproxy.j2 dest=./build/Dockerfile.webproxy

    - name: Building coriolis-web-proxy image
      docker_image: path=./build dockerfile=Dockerfile.webproxy name={{ docker_registry }}/{{ coriolis_containers_namespace }}/coriolis-web-proxy pull=False push={{ docker_push_images}} tag={{ docker_images_tag }}
