[DEFAULT]
log_dir=/tmp
log_file=coriolis.log
messaging_transport_url=rabbit://coriolis:Passw0rd@127.0.0.1:5672/

[common_target_options]
# Configure guest NICs with DHCP during OS morphing.
# Written to osmorphing_info nics_set_dhcp.
# Used when the destination environment omits set_dhcp and the provider omits nics_set_dhcp.
# When disabled, guest static IPs are preserved after the migration.
# Default is true.
# set_dhcp = true
# Prevents the destination cloud provisioning from resetting the pre-existing credentials.
# When disabled, the destination platform may also create a provisioned cloud guest user.
# Stored on osmorphing_parameters retain_user_credentials.
# Used when the destination environment and the provider both omit the key.
# Default is false.
# retain_user_credentials = false

[keystone_authtoken]
auth_type = password
auth_url = http://keystone:35357
username = coriolis
password = mysecret
user_domain_name = default
project_name = service
project_domain_name = default

[trustee]
auth_type = password
auth_url = http://keystone:35357/v3
username = coriolis
user_domain_name = default
password = mysecret

[keystone]
auth_url = http://keystone:5000/v3

[openstack_migration_provider]
disk_format = qcow2
hypervisor_type = QEMU
migr_image_name_map = linux: Ubuntu 15.10, windows: Nano
migr_network_name = private
fip_pool_name = public
migr_flavor_name = m1.small
