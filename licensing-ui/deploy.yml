---
- hosts: localhost

  tasks:
    - name: Creating Coriolis Licensing UI database
      mysql_db:
        login_host: "{{ database_address }}"
        login_port: "{{ database_port }}"
        login_user: "{{ database_user }}"
        login_password: "{{ database_password }}"
        name: "{{ coriolis_licensing_ui_database_name }}"
      run_once: True

    - name: Creating Licensing UI database user and setting permissions
      mysql_user:
        login_host: "{{ database_address }}"
        login_port: "{{ database_port }}"
        login_user: "{{ database_user }}"
        login_password: "{{ database_password }}"
        name: "{{ coriolis_licensing_ui_database_username }}"
        password: "{{ coriolis_licensing_ui_database_password }}"
        host: "%"
        priv: "{{ coriolis_licensing_ui_database_name }}.*:ALL"
        append_privs: "yes"
      run_once: True

    - name: Creating coriolis-licensing-ui container
      docker_container:
        name: coriolis-licensing-ui
        image: "{{ docker_registry }}/{{ coriolis_containers_namespace }}/coriolis-licensing-ui:{{ docker_images_tag }}"
        pull: "{{ pull_coriolis_docker_images }}"
        hostname: coriolis-licensing-ui
        state: started
        restart: yes
        restart_policy: always
        network_mode: host
        env:
            BASENAME: "/licensing-ui"
            IDENTITY_API: "{{ keystone_auth_url_v3 }}"
            PORT: "{{ coriolis_licensing_ui_server_port_internal | string }}"
            MARIA_DB_HOST: "{{ database_address }}"
            MARIA_DB_PORT: "{{ database_port | string }}"
            MARIA_DB_NAME: "{{ coriolis_licensing_ui_database_name }}"
            MARIA_DB_USER: "{{ coriolis_licensing_ui_database_username }}"
            MARIA_DB_PASSWORD: "{{ coriolis_licensing_ui_database_password }}"
            EMAIL_HOST: "{{ coriolis_licensing_ui_email_host }}"
            EMAIL_PORT: "{{ coriolis_licensing_ui_email_port | string }}"
            EMAIL_SECURE: "{{ coriolis_licensing_ui_email_secure | string }}"
            EMAIL_IGNORE_TLS: "{{ coriolis_licensing_ui_email_ignore_tls | string }}"
            EMAIL_USER: "{{ coriolis_licensing_ui_email_username }}"
            EMAIL_PASSWORD: "{{ coriolis_licensing_ui_email_password }}"
        expose:
        - "{{ coriolis_licensing_ui_server_port_internal }}"
        ports:
        - "{{ coriolis_licensing_ui_server_port_internal }}:{{ coriolis_licensing_ui_server_port_external }}"
