---
- hosts: localhost

  tasks:
    - name: Stopping licensing UI server container
      docker_container:
        name: coriolis-licensing-ui
        state: "stopped"

    - name: Removing existing Coriolis Licensing UI DB
      mysql_db:
        login_host: "{{ database_address }}"
        login_port: "{{ database_port }}"
        login_user: "{{ database_user }}"
        login_password: "{{ database_password }}"
        name: "{{ coriolis_licensing_ui_database_name }}"
        state: "absent"
      run_once: True

    - name: Recreating Coriolis licensing UI database
      mysql_db:
        login_host: "{{ database_address }}"
        login_port: "{{ database_port }}"
        login_user: "{{ database_user }}"
        login_password: "{{ database_password }}"
        name: "{{ coriolis_licensing_ui_database_name }}"
      run_once: True
