---
- hosts: localhost

  tasks:
    - name: Creating coriolis database
      mysql_db:
        login_host: "{{ database_address }}"
        login_port: "{{ database_port }}"
        login_user: "{{ database_user }}"
        login_password: "{{ database_password }}"
        name: "{{ coriolis_database_name }}"
      run_once: True

    - name: Creating coriolis database user and setting permissions
      mysql_user:
        login_host: "{{ database_address }}"
        login_port: "{{ database_port }}"
        login_user: "{{ database_user }}"
        login_password: "{{ database_password }}"
        name: "{{ coriolis_database_name }}"
        password: "{{ coriolis_database_password }}"
        host: "%"
        priv: "{{ coriolis_database_name }}.*:ALL"
        append_privs: "yes"
      run_once: True

    - name: Increasing 'max_allowed_packet' for database
      ini_file:
          path: /etc/kolla/mariadb/galera.cnf
          section: mysqld
          option: max_allowed_packet
          value: 64M
          backup: yes

    - name: Restarting database container
      shell: docker restart mariadb

    - name: Creating config directory
      file:
        path: "{{ coriolis_config_directory_path_host }}"
        state: directory

    - name: Creating coriolis-logger config directory
      file:
        path: "{{ coriolis_logger_config_directory_host }}"
        state: directory

    - name: Creating log directory
      file:
        path: /var/log/coriolis
        state: directory
    
    - name: Creating influxdb config dir
      file:
        path: /etc/influxdb
        state: directory
    
    - name: Creating influxdb config file
      template:
        src: ./templates/influxdb.conf.j2
        dest: "/etc/influxdb/influxdb.conf"
        force: no

    - name: Creating UI mod directory
      file:
        path: "{{ coriolis_web_mod_directory_path_host }}"
        state: directory

    - name: Creating UI mod file
      template:
        src: ./templates/ui-mod.json.j2
        dest: "{{ coriolis_web_mod_directory_path_host }}/ui-mod.json"
        force: no

    - name: Creating coriolis.conf
      template:
        src: ./templates/coriolis.conf.j2
        dest: "{{ coriolis_config_directory_path_host }}/coriolis.conf"
        force: no
    
    - name: Creating coriolis-logger.toml
      template:
        src: ./templates/coriolis-logger.toml.j2
        dest: "{{ coriolis_logger_config_directory_host }}/coriolis-logger.toml"
        force: yes
    
    - name: Create influxdb data volume
      docker_volume:
        name: "{{ influxdb_data_volume_name }}"
    
    - name: Create coriolis-logger volume
      docker_volume:
        name: "{{ coriolis_logger_volume }}"

    - name: Creating api-paste.ini
      template:
        src: ./templates/api-paste.ini.j2
        dest: "{{ coriolis_config_directory_path_host }}/api-paste.ini"

    - name: Creating oslo.policy file
      template:
        src: ./templates/policy.yml.j2
        dest: "{{ coriolis_policy_config_path }}"

    - name: Checking Coriolis Keystone service
      shell: openstack service list -c Name | grep coriolis
      environment:
        OS_AUTH_URL: "{{ keystone_auth_url }}"
        OS_IDENTITY_API_VERSION: 3
        OS_PASSWORD: "{{ keystone_admin_password }}"
        OS_PROJECT_NAME: admin
        OS_TENANT_NAME: admin
        OS_USERNAME: admin
        OS_USER_DOMAIN_NAME: "default"
        OS_PROJECT_DOMAIN_NAME: "default"
      retries: 10
      delay: 5
      register: service_list
      failed_when: "service_list.rc > 1"

    - name: Creating Coriolis Keystone service
      command: openstack service create --name coriolis --description "Cloud Migration as a Service" migration
      environment:
        OS_AUTH_URL: "{{ keystone_auth_url }}"
        OS_IDENTITY_API_VERSION: 3
        OS_PASSWORD: "{{ keystone_admin_password }}"
        OS_PROJECT_NAME: admin
        OS_TENANT_NAME: admin
        OS_USERNAME: admin
        OS_USER_DOMAIN_NAME: "default"
        OS_PROJECT_DOMAIN_NAME: "default"
      run_once: True
      retries: 10
      delay: 5
      when: service_list.rc == 1

    - name: Checking Coriolis Keystone endpoints
      shell: openstack endpoint list -c "Service Name" | grep coriolis
      environment:
        OS_AUTH_URL: "{{ keystone_auth_url }}"
        OS_IDENTITY_API_VERSION: 3
        OS_PASSWORD: "{{ keystone_admin_password }}"
        OS_PROJECT_NAME: admin
        OS_TENANT_NAME: admin
        OS_USERNAME: admin
        OS_USER_DOMAIN_NAME: "default"
        OS_PROJECT_DOMAIN_NAME: "default"
      retries: 10
      delay: 5
      register: endpoint_list
      failed_when: "endpoint_list.rc > 1"

    - name: Creating Coriolis Keystone endpoints
      command: "openstack endpoint create migration {{ item.interface }} {{ item.url }}"
      environment:
        OS_AUTH_URL: "{{ keystone_auth_url }}"
        OS_IDENTITY_API_VERSION: 3
        OS_PASSWORD: "{{ keystone_admin_password }}"
        OS_PROJECT_NAME: admin
        OS_TENANT_NAME: admin
        OS_USERNAME: admin
        OS_USER_DOMAIN_NAME: "default"
        OS_PROJECT_DOMAIN_NAME: "default"
      run_once: True
      retries: 10
      delay: 5
      when: endpoint_list.rc == 1
      with_items:
        - {'interface': 'admin', 'url': '{{ coriolis_admin_endpoint }}'}
        - {'interface': 'internal', 'url': '{{ coriolis_internal_endpoint }}'}
        - {'interface': 'public', 'url': '{{ coriolis_public_endpoint }}'}

    - name: Checking Coriolis Keystone user
      shell: openstack user list -c Name | grep {{ coriolis_keystone_user }}
      environment:
        OS_AUTH_URL: "{{ keystone_auth_url }}"
        OS_IDENTITY_API_VERSION: 3
        OS_PASSWORD: "{{ keystone_admin_password }}"
        OS_PROJECT_NAME: admin
        OS_TENANT_NAME: admin
        OS_USERNAME: admin
        OS_USER_DOMAIN_NAME: "default"
        OS_PROJECT_DOMAIN_NAME: "default"
      retries: 10
      delay: 5
      register: user_list
      failed_when: "user_list.rc > 1"

    - name: Creating Coriolis Keystone user
      command: "openstack user create --domain default --password '{{ coriolis_keystone_password }}' {{ coriolis_keystone_user }}"
      environment:
        OS_AUTH_URL: "{{ keystone_auth_url }}"
        OS_IDENTITY_API_VERSION: 3
        OS_PASSWORD: "{{ keystone_admin_password }}"
        OS_PROJECT_NAME: admin
        OS_TENANT_NAME: admin
        OS_USERNAME: admin
        OS_USER_DOMAIN_NAME: "default"
        OS_PROJECT_DOMAIN_NAME: "default"
      run_once: True
      retries: 10
      delay: 5
      when: user_list.rc == 1

    - name: Adding Coriolis Keystone user to the service admin role
      command: "openstack role add --project service --user {{ coriolis_keystone_user }} admin"
      environment:
        OS_AUTH_URL: "{{ keystone_auth_url }}"
        OS_IDENTITY_API_VERSION: 3
        OS_PASSWORD: "{{ keystone_admin_password }}"
        OS_PROJECT_NAME: admin
        OS_TENANT_NAME: admin
        OS_USERNAME: admin
        OS_USER_DOMAIN_NAME: "default"
        OS_PROJECT_DOMAIN_NAME: "default"
      run_once: True
      retries: 10
      delay: 5

    - name: influxdb container
      docker_container:
        name: influxdb
        image: "{{ influxdb_image_tag }}"
        hostname: influxdb
        state: started
        restart_policy: unless-stopped
        network_mode: host
        volumes:
        - "{{ influxdb_data_volume_name }}:{{influxdb_data_dir}}:rw"
        - "/etc/influxdb/influxdb.conf:/etc/influxdb/influxdb.conf:ro"
    
    - name: Create influxdb admin user
      command: "docker exec influxdb influx -username {{ influxdb_admin_user_name }} -password {{ influxdb_admin_user_password }} -execute \"CREATE USER {{ influxdb_admin_user_name }} WITH PASSWORD '{{ influxdb_admin_user_password }}' WITH ALL PRIVILEGES\""
      run_once: True
      retries: 10
      delay: 5
      register: influx_admin_user
      failed_when: "influx_admin_user.rc > 0"

    - name: Create influxdb coriolis user
      command: "docker exec influxdb influx -username {{ influxdb_admin_user_name }} -password {{ influxdb_admin_user_password }} -execute \"CREATE USER {{ influxdb_user_name }} WITH PASSWORD '{{ influxdb_user_password }}' WITH ALL PRIVILEGES\""
      run_once: True
      retries: 10
      delay: 5
      register: influx_user
      failed_when: "influx_user.rc > 0"

    - name: Create influxdb database
      command: "docker exec influxdb influx -username {{ influxdb_admin_user_name }} -password {{ influxdb_admin_user_password }} -execute \"CREATE DATABASE {{ influxdb_database_name }}\""
      run_once: True
      retries: 10
      delay: 5

    - name: Grant access to influxdb database
      command: "docker exec influxdb influx -username {{ influxdb_admin_user_name }} -password {{ influxdb_admin_user_password }} -execute \"GRANT ALL on {{ influxdb_database_name }} TO {{ influxdb_user_name }}\""
      run_once: True
      retries: 10
      delay: 5
      register: influx_db
      failed_when: "influx_db.rc > 0"
    
    - name: coriolis-logger container
      docker_container:
        name: coriolis-logger
        image: "{{ docker_registry }}/{{ coriolis_containers_namespace }}/coriolis-logger:{{ docker_images_tag }}"
        pull: "{{ pull_coriolis_docker_images }}"
        hostname: coriolis-logger
        state: started
        restart: yes
        restart_policy: unless-stopped
        network_mode: host
        volumes:
        - "{{coriolis_logger_config_directory_host}}/coriolis-logger.toml:{{coriolis_logger_config}}"
        - "{{ coriolis_logger_volume }}:{{ coriolis_logger_socket_dir }}"
        ports:
        - "{{coriolis_logger_port}}:{{coriolis_logger_port}}"
    
    - name: Checking Coriolis logger service
      shell: openstack service list -c Name | grep coriolis-logger
      environment:
        OS_AUTH_URL: "{{ keystone_auth_url }}"
        OS_IDENTITY_API_VERSION: 3
        OS_PASSWORD: "{{ keystone_admin_password }}"
        OS_PROJECT_NAME: admin
        OS_TENANT_NAME: admin
        OS_USERNAME: admin
        OS_USER_DOMAIN_NAME: "default"
        OS_PROJECT_DOMAIN_NAME: "default"
      retries: 10
      delay: 5
      register: service_list_logger
      failed_when: "service_list_logger.rc > 1"

    - name: Creating Coriolis logger Keystone service
      command: openstack service create --name coriolis-logger --description "Coriolis logger service" coriolis-logger
      environment:
        OS_AUTH_URL: "{{ keystone_auth_url }}"
        OS_IDENTITY_API_VERSION: 3
        OS_PASSWORD: "{{ keystone_admin_password }}"
        OS_PROJECT_NAME: admin
        OS_TENANT_NAME: admin
        OS_USERNAME: admin
        OS_USER_DOMAIN_NAME: "default"
        OS_PROJECT_DOMAIN_NAME: "default"
      run_once: True
      retries: 10
      delay: 5
      when: service_list_logger.rc == 1

    - name: Checking Coriolis logger Keystone endpoints
      shell: openstack endpoint list -c "Service Name" | grep coriolis-logger
      environment:
        OS_AUTH_URL: "{{ keystone_auth_url }}"
        OS_IDENTITY_API_VERSION: 3
        OS_PASSWORD: "{{ keystone_admin_password }}"
        OS_PROJECT_NAME: admin
        OS_TENANT_NAME: admin
        OS_USERNAME: admin
        OS_USER_DOMAIN_NAME: "default"
        OS_PROJECT_DOMAIN_NAME: "default"
      retries: 10
      delay: 5
      register: endpoint_list_logger
      failed_when: "endpoint_list_logger.rc > 1"

    - name: Creating Coriolis logger Keystone endpoints
      command: "openstack endpoint create coriolis-logger {{ item.interface }} {{ item.url }}"
      environment:
        OS_AUTH_URL: "{{ keystone_auth_url }}"
        OS_IDENTITY_API_VERSION: 3
        OS_PASSWORD: "{{ keystone_admin_password }}"
        OS_PROJECT_NAME: admin
        OS_TENANT_NAME: admin
        OS_USERNAME: admin
        OS_USER_DOMAIN_NAME: "default"
        OS_PROJECT_DOMAIN_NAME: "default"
      run_once: True
      retries: 10
      delay: 5
      when: endpoint_list_logger.rc == 1
      with_items:
        - {'interface': 'admin', 'url': '{{ coriolis_logger_endpoint }}'}
        - {'interface': 'internal', 'url': '{{ coriolis_logger_endpoint }}'}
        - {'interface': 'public', 'url': '{{ coriolis_logger_endpoint }}'}

    - name: coriolis-api container
      docker_container:
        name: coriolis-api
        image: "{{ docker_registry }}/{{ coriolis_containers_namespace }}/coriolis-api:{{ docker_images_tag }}"
        pull: "{{ pull_coriolis_docker_images }}"
        hostname: coriolis-api
        state: started
        restart: yes
        restart_policy: unless-stopped
        network_mode: host
        volumes:
        - "{{ coriolis_config_directory_path_host }}:{{ coriolis_config_directory_path }}:ro"
        - "/var/log/coriolis:/var/log/coriolis:rw"
        - "{{ coriolis_logger_volume }}:{{ coriolis_logger_socket_dir }}"
        ports:
        - "7667:7667"

    - name: coriolis-conductor container
      docker_container:
        name: coriolis-conductor
        image: "{{ docker_registry }}/{{ coriolis_containers_namespace }}/coriolis-conductor:{{ docker_images_tag }}"
        pull: "{{ pull_coriolis_docker_images }}"
        hostname: coriolis-conductor
        state: started
        restart: yes
        restart_policy: unless-stopped
        network_mode: host
        env:
            LICENSING_SERVER_BASE_URL: "{{ licensing_server_base_url | string }}"
            LICENSING_SERVER_ALLOW_UNTRUSTED: "true"
            RUN_DBSYNC: "yes"
        volumes:
        - "{{ coriolis_config_directory_path_host }}:{{ coriolis_config_directory_path }}:ro"
        - "/var/log/coriolis:/var/log/coriolis:rw"
        - "{{ coriolis_logger_volume }}:{{ coriolis_logger_socket_dir }}"

    - name: coriolis-replica-cron container
      docker_container:
        name: coriolis-replica-cron
        image: "{{ docker_registry }}/{{ coriolis_containers_namespace }}/coriolis-replica-cron:{{ docker_images_tag }}"
        pull: "{{ pull_coriolis_docker_images }}"
        hostname: coriolis-replica-cron
        state: started
        restart: yes
        restart_policy: unless-stopped
        network_mode: host
        volumes:
        - "{{ coriolis_config_directory_path_host }}:{{ coriolis_config_directory_path }}:ro"
        - "/var/log/coriolis:/var/log/coriolis:rw"
        - "{{ coriolis_logger_volume }}:{{ coriolis_logger_socket_dir }}"

    - name: coriolis-web container
      docker_container:
        name: coriolis-web
        image: "{{ docker_registry }}/{{ coriolis_containers_namespace }}/coriolis-web:{{ docker_images_tag }}"
        pull: "{{ pull_coriolis_docker_images }}"
        hostname: coriolis-web
        state: started
        restart: yes
        restart_policy: unless-stopped
        network_mode: host
        volumes:
        - "{{ coriolis_web_mod_directory_path_host }}:{{ coriolis_web_mod_directory_path }}:rw"
        - "{{ coriolis_logger_volume }}:{{ coriolis_logger_socket_dir }}"
        env:
          CORIOLIS_LICENSING_BASE_URL: "/licensing"
          MOD_JSON: "{{ coriolis_web_mod_directory_path }}/ui-mod.json"
